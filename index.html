<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main</title>
    <link rel="stylesheet" href="index_style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=stat_minus_1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=help,attach_file" />
  </head>
  <body>
    <section class="page">
      <header id="website_header">
        <img
          id="logo_img"
          src="images/logo_image.png"
          width="20px"
          height="20px"
        />
        <p id="header_p">ChatGPT</h1>
        
        <div class="arrow_icon_header">
            <span class="material-symbols-outlined">stat_minus_1</span> 
        </div> 

        <ul id="header_list">
          <il class="text_row">About</il>
          <il class="text_row">Features</il>
          <il class="text_row">Learn</il>
          <il class="text_row">Business</il>
          <il class="text_row">Pricing</il>
          <il class="text_row">Images</il>
          <il class="text_row">Download</il>
        </ul>

        <div id="log_in_box">
            <p id="log_in">Log In</p>
        </div>

        <div id="sign_up_box">
            <p id="sign_up">Sign up for free</p>
        </div>


        <div class="arrow_icon_header">
            <span class="material-symbols-outlined arrow_icon">help</span>
        </div> 
      </header>

      <main>
         <p id="p_of_main">What's on the agenda today?</p>
         <section id="main_box">
            <form action="/submit" function="post">
                <input id="input_box"
            type="text"
            id="text_input"
            name="text_input"
          />
          <label id="input_text" for="text_input">Ask anything</label>
          <div id="attach_box">
            <span class="material-symbols-outlined">attach_file</span>

          </div>
            </form>


         </section>
      </main>
    </section>
  </body>
</html>
