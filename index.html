<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index_style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=keyboard_arrow_down,help,attach_file,language,book_ribbon,photo_auto_merge,graphic_eq"
    />
  </head>
  <body>
    <div class="page">
      <header class="web_header">
        <img
          class="logo_img"
          src="images/gpt_logo.png"
          width="20px"
          height="20px"
        />
        <p class="website_name">ChatGPT</p>
        <span class="material-symbols-outlined arrow_icon">
          keyboard_arrow_down
        </span>
        <navbar class="website_navbar">
          <div class="saira-font nav_option">About</div>
          <div class="saira-font nav_option">Features</div>
          <div class="saira-font nav_option">Learn</div>
          <div class="saira-font nav_option">Business</div>
          <div class="saira-font nav_option">Pricing</div>
          <div class="saira-font nav_option">Images</div>
          <div class="saira-font nav_option">Download</div>
        </navbar>

        <div class="log_in">
          <p class="saira-font log_in_p">Log in</p>
        </div>
        <div class="sign_up">
          <p class="saira-font sign_up_p">Sign up for free</p>
        </div>
        <span class="material-symbols-outlined help_icon"> help </span>
      </header>

      <main class="main_section">
        <h1 class="saira-font main_h1">What's on the agenda today?</h1>
        <div class="chat_box">
          <textarea class="text_input" placeholder="Ask anything"></textarea>
        </div>

        <section class="chat_box_buttons">
          <div class="button attach">
            <span class="material-symbols-outlined attach_icon">
              attach_file
            </span>
            <p class="saira-font button_p">Attach</p>
          </div>

          <div class="button search">
            <span class="material-symbols-outlined language_icon">
              language
            </span>
            <p class="saira-font button_p">Search</p>
          </div>

          <div class="button study">
            <span class="material-symbols-outlined book_icon">
              book_ribbon
            </span>
            <p class="saira-font button_p">Study</p>
          </div>

          <div class="button create_img">
            <span class="material-symbols-outlined create_img_icon">
              photo_auto_merge
            </span>
            <p class="saira-font button_p">Create image</p>
          </div>
        </section>

        <div class="voice_button">
          <span class="material-symbols-outlined voice_icon"> graphic_eq </span>
          <p class="saira-font voice_p">Voice</p>
        </div>
      </main>
    </div>
  </body>
</html>
